version: '3'

tasks:
  _ensure:main:
    internal: true
    silent: true
    cmds:
      - |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" != "main" ]; then
          echo "❌ Error: Version bumping and tagging must be performed on the 'main' branch (current: $BRANCH)"
          exit 1
        fi
  # -----------------------------------------------------------------------------
  # Versioning

  bump:
    desc: Bump versions and generate changelog (via nx release)
    deps: [_ensure:main]
    cmds:
      - bunx nx release --yes

  # -----------------------------------------------------------------------------
  # Changelog Management

  changelog:update:
    desc: Update CHANGELOG.md from git commits
    cmds:
      - dart run scripts/update_changelog.dart

  changelog:preview:
    desc: Preview changelog updates without writing
    cmds:
      - dart run scripts/update_changelog.dart --dry-run

  # -----------------------------------------------------------------------------
  # High-level Release Builds

  web:
    desc: Build the web application for release
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:web
        vars:
          APP_ENV: '{{.APP_ENV}}'

  android:
    desc: Build the Android application
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:android
        vars:
          APP_ENV: '{{.APP_ENV}}'
          BUILD_NAME: '{{.BUILD_NAME}}'
          BUILD_NUMBER: '{{.BUILD_NUMBER}}'

  ios:
    desc: Build the iOS application
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:ios
        vars:
          APP_ENV: '{{.APP_ENV}}'

  ios:screenshots:
    desc: Capture iOS App Store screenshots
    platforms: [darwin]
    cmds:
      - task: :fastlane:ios:screenshots

  ios:screenshots:frame:
    desc: Frame iOS screenshots locally (optional)
    platforms: [darwin]
    cmds:
      - task: :fastlane:ios:screenshots:frame

  android:screenshots:
    desc: Capture Android Play Store screenshots locally
    cmds:
      - task: :fastlane:android:screenshots

  android:screenshots:frame:
    desc: Frame Android screenshots locally (optional)
    cmds:
      - task: :fastlane:android:screenshots:frame

  linux:
    desc: Build the Linux application
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:linux
        vars:
          APP_ENV: '{{.APP_ENV}}'

  windows:
    desc: Build the Windows application
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:windows
        vars:
          APP_ENV: '{{.APP_ENV}}'

  macos:
    desc: Build the macOS application
    cmds:
      - task: :clean
      - task: :flutter:get
      - task: :flutter:build:macos
        vars:
          APP_ENV: '{{.APP_ENV}}'
