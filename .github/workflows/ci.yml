name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo toolchain (.tool-versions). `latest` floats
          # across bun releases whose install-cache format may differ,
          # which corrupted restores and broke `bun install` with ENOENTs.
          bun-version: 1.3.14

      - name: Restore Bun cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('bun.lock', 'nx.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('bun.lock', 'nx.json') }}-
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: bun install

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install tools
        run: |
          bun add -g firebase-tools@15.22.1
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0

      - name: Generate Dummy Firebase Options
        run: task firebase:generate-dummy-options

      - name: Initialize Nx
        run: bunx nx --version

      - name: Validate all projects
        run: bunx nx run-many -t lint test build --parallel=3

      - name: Level Data Validation
        run: |
          bunx nx run level-builder:validate
          bunx nx run level-builder:tutorials-validate

      # Save the bun cache only when everything succeeded, so a failed
      # run can never poison the cache for subsequent runs (stale/partial
      # caches previously broke `bun install` with ENOENT copy errors).
      - name: Save Bun cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('**/bun.lock') }}
