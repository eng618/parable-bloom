version: "3"

tasks:
  # -----------------------------------------------------------------------------
  # Dependencies & Setup
  # -----------------------------------------------------------------------------

  get:
    desc: Get Flutter dependencies
    run: once
    dir: apps/parable-bloom
    cmds:
      - flutter pub get
    preconditions:
      - sh: command -v flutter >/dev/null 2>&1
        msg: "Flutter is not installed. Please install Flutter to proceed."

  upgrade:
    desc: Upgrade Flutter dependencies
    dir: apps/parable-bloom
    cmds:
      - flutter pub upgrade
    preconditions:
      - sh: command -v flutter >/dev/null 2>&1
        msg: "Flutter is not installed."

  ios:pod-install:
    desc: Run CocoaPods install in ios directory
    platforms: [darwin]
    dir: apps/parable-bloom/ios
    cmds:
      - pod install
    run: once

  macos:pod-install:
    desc: Run CocoaPods install in macos directory
    platforms: [darwin]
    dir: apps/parable-bloom/macos
    cmds:
      - pod install
    run: once

  _ensure_ios_sim:
    internal: true
    platforms: [darwin]
    cmds:
      - task: get
      - task: ios:pod-install
      - ./scripts/ios/boot_simulator.sh

  # -----------------------------------------------------------------------------
  # Toolchain & Diagnostics
  # -----------------------------------------------------------------------------

  check:macos:toolchain:
    desc: Verify Xcode command-line tooling for macOS/iOS builds
    platforms: [darwin]
    cmds:
      - xcode-select -p
    preconditions:
      - sh: command -v xcodebuild >/dev/null 2>&1
        msg: |
          Xcode build tools are not available.
          Install Xcode from the App Store, then run:
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - sh: xcode-select -p >/dev/null 2>&1
        msg: |
          Xcode command-line tools are not configured.
          Run one of these commands:
            xcode-select --install
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

  doctor:macos:
    desc: Show macOS development toolchain status for Flutter desktop/iOS work
    platforms: [darwin]
    silent: true
    cmds:
      - |
        echo "== macOS doctor (Flutter + Apple toolchain) =="
        echo

        if command -v flutter >/dev/null 2>&1; then
          echo "[OK] flutter: $(flutter --version | head -n 1)"
        else
          echo "[MISSING] flutter"
        fi

        if command -v xcodebuild >/dev/null 2>&1; then
          echo "[OK] xcodebuild: $(xcodebuild -version | head -n 1)"
        else
          echo "[MISSING] xcodebuild (install Xcode and select developer dir)"
        fi

        if xcode-select -p >/dev/null 2>&1; then
          echo "[OK] xcode-select path: $(xcode-select -p)"
        else
          echo "[MISSING] xcode-select configuration"
        fi

        if command -v pod >/dev/null 2>&1; then
          echo "[OK] cocoapods: $(pod --version)"
        else
          echo "[MISSING] cocoapods (needed for iOS/macOS pods)"
        fi

        if command -v firebase >/dev/null 2>&1; then
          echo "[OK] firebase CLI: $(firebase --version)"
        else
          echo "[MISSING] firebase CLI"
        fi

        if command -v flutterfire >/dev/null 2>&1; then
          echo "[OK] flutterfire CLI: $(flutterfire --version | head -n 1)"
        else
          echo "[MISSING] flutterfire CLI"
        fi

        echo
        echo "If xcodebuild is missing:"
        echo "  1) Install Xcode from the App Store"
        echo "  2) sudo xcode-select -s /Applications/Xcode.app/Contents/Developer"
        echo "  3) sudo xcodebuild -runFirstLaunch"

  # -----------------------------------------------------------------------------
  # Development & Serving (Local Execution)
  # -----------------------------------------------------------------------------

  dev:
    desc: Run the application in dev mode for the current platform
    cmds:
      - task: dev:linux
      - task: dev:darwin

  dev:darwin:
    desc: Run the application in dev mode with Chrome
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - flutter run -d chrome --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  dev:linux:
    desc: Run the application in dev mode with Chromium
    dir: apps/parable-bloom
    platforms: [linux]
    cmds:
      - CHROME_EXECUTABLE=/snap/bin/chromium flutter run -d chrome --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:web:
    desc: Serve the application locally
    dir: apps/parable-bloom
    cmds:
      - flutter run -d chrome --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:web:clean:
    desc: Clean and serve the application
    cmds:
      - task: clean
      - task: get
      - task: serve:web

  serve:android:
    desc: Serve the application on Android
    dir: apps/parable-bloom
    vars:
      DEVICE: '{{.DEVICE | default "SM S901U"}}'
    cmds:
      - flutter run -d '{{.DEVICE}}' --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:ios:
    desc: Serve the application on iOS simulator (auto-selects available simulator)
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - task: _ensure_ios_sim
      - flutter run --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:ios:clean:
    desc: Clean and serve the application on iOS simulator
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - task: clean
      - task: _ensure_ios_sim
      - flutter run --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:macos:
    desc: Serve the application on macOS
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - task: check:macos:toolchain
      - flutter run -d macos --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:linux:
    desc: Serve the application on Linux
    dir: apps/parable-bloom
    platforms: [linux]
    cmds:
      - flutter run -d linux --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:windows:
    desc: Serve the application on Windows
    dir: apps/parable-bloom
    platforms: [windows]
    cmds:
      - flutter run -d windows --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  # -----------------------------------------------------------------------------
  # Environment-Specific Execution
  # -----------------------------------------------------------------------------

  serve:dev:
    desc: Run the application in development environment
    dir: apps/parable-bloom
    cmds:
      - flutter run --dart-define=APP_ENV=dev --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:dev:web:
    desc: Run the web application in development environment
    dir: apps/parable-bloom
    cmds:
      - flutter run -d chrome --dart-define=APP_ENV=dev --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:preview:
    desc: Run the application in preview environment
    dir: apps/parable-bloom
    cmds:
      - flutter run --dart-define=APP_ENV=preview --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:preview:web:
    desc: Run the web application in preview environment
    dir: apps/parable-bloom
    cmds:
      - flutter run -d chrome --dart-define=APP_ENV=preview --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:prod:
    desc: Run the application in production environment
    dir: apps/parable-bloom
    cmds:
      - flutter run --dart-define=APP_ENV=prod --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  serve:prod:web:
    desc: Run the web application in production environment
    dir: apps/parable-bloom
    cmds:
      - flutter run -d chrome --dart-define=APP_ENV=prod --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}

  # -----------------------------------------------------------------------------
  # Code Quality, Formatting & Linting
  # -----------------------------------------------------------------------------

  analyze:
    desc: Analyze the Flutter code
    dir: apps/parable-bloom
    cmds:
      - flutter analyze

  lint:
    desc: Run Flutter linting (strict — warnings and infos fail the build)
    dir: apps/parable-bloom
    cmds:
      - flutter analyze --fatal-infos --fatal-warnings

  lint:fix:
    desc: Fix Flutter linting issues
    dir: apps/parable-bloom
    cmds:
      - dart fix --apply

  format:
    desc: Format the Flutter code
    dir: apps/parable-bloom
    cmds:
      - dart format lib test integration_test test_driver

  format:check:
    desc: Check if Flutter code is formatted
    dir: apps/parable-bloom
    cmds:
      - find lib test -name "*.dart" -not -name "firebase_options.dart" -exec dart format --output=none --set-exit-if-changed {} \;

  fix:
    desc: Fix Flutter code (lints and formatting)
    cmds:
      - task: format
      - task: lint:fix

  # -----------------------------------------------------------------------------
  # Testing
  # -----------------------------------------------------------------------------

  test:
    desc: Run Flutter tests (excludes level solver tests)
    dir: apps/parable-bloom
    cmds:
      - flutter test --coverage --exclude-tags=level-solver

  test:levels:
    desc: Run level solver tests only (for when adding new levels)
    dir: apps/parable-bloom
    cmds:
      - flutter test test/level_validation_test.dart

  test:all:
    desc: Run all tests including level solver tests
    dir: apps/parable-bloom
    cmds:
      - flutter test

  coverage:check:
    desc: Fail if Flutter line coverage drops below threshold (default 50%)
    dir: apps/parable-bloom
    cmds:
      - dart ../../scripts/check_coverage.dart {{.THRESHOLD | default "50"}}

  test:dev:
    desc: Run tests in development environment
    dir: apps/parable-bloom
    cmds:
      - flutter test --dart-define=APP_ENV=dev

  test:preview:
    desc: Run tests in preview environment
    dir: apps/parable-bloom
    cmds:
      - flutter test --dart-define=APP_ENV=preview

  test:prod:
    desc: Run tests in production environment
    dir: apps/parable-bloom
    cmds:
      - flutter test --dart-define=APP_ENV=prod

  validate:
    desc: Validate the Flutter app (strict lint + tests + web build)
    cmds:
      - task: lint
      - task: test
      - task: build:web

  # -----------------------------------------------------------------------------
  # Builds & Compilation
  # -----------------------------------------------------------------------------

  build:web:
    desc: Build the Flutter application for Web
    dir: apps/parable-bloom
    sources:
      - lib/**/*
      - assets/**/*
      - pubspec.yaml
      - web/**/*
    generates:
      - build/web/**/*
    cmds:
      - |
        flutter build web --release --source-maps \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}
      - task: _sentry:upload
    preconditions:
      - sh: command -v flutter >/dev/null 2>&1
        msg: "Flutter is not installed."

  build:android:
    desc: Build the Android application
    dir: apps/parable-bloom
    cmds:
      - |
        flutter build appbundle --release \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-} \
          --obfuscate --split-debug-info=build/app/symbols \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
          {{if .BUILD_NAME}}--build-name "{{.BUILD_NAME}}"{{end}} \
          {{if .BUILD_NUMBER}}--build-number "{{.BUILD_NUMBER}}"{{end}}
      - task: _sentry:upload

  build:ios:
    desc: Build the iOS application
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - |
        flutter build ios --release \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-} \
          --obfuscate --split-debug-info=build/app/symbols \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json
      - task: _sentry:upload

  build:linux:
    desc: Build the Linux application
    dir: apps/parable-bloom
    platforms: [linux]
    cmds:
      - |
        flutter build linux --release \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-} \
          --obfuscate --split-debug-info=build/app/symbols \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json
      - task: _sentry:upload

  build:windows:
    desc: Build the Windows application
    dir: apps/parable-bloom
    platforms: [windows]
    cmds:
      - |
        flutter build windows --release \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-} \
          --obfuscate --split-debug-info=build/app/symbols \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json
      - task: _sentry:upload

  build:macos:
    desc: Build the macOS application
    dir: apps/parable-bloom
    platforms: [darwin]
    cmds:
      - |
        flutter build macos --release \
          --dart-define=APP_ENV={{.APP_ENV | default "prod"}} --dart-define=SENTRY_DSN=${SENTRY_DSN:-} \
          --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} \
          --dart-define=OPENPANEL_CLIENT_SECRET=${OPENPANEL_CLIENT_SECRET:-} \
          --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-} \
          --obfuscate --split-debug-info=build/app/symbols \
          --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json
      - task: _sentry:upload

  build:web:dev:
    desc: Build the web application for development environment
    dir: apps/parable-bloom
    cmds:
      - flutter build web --release --source-maps --dart-define=APP_ENV=dev --dart-define=SENTRY_DSN=${SENTRY_DSN:-} --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}
      - task: _sentry:upload

  build:web:preview:
    desc: Build the web application for preview environment
    dir: apps/parable-bloom
    cmds:
      - flutter build web --release --source-maps --dart-define=APP_ENV=preview --dart-define=SENTRY_DSN=${SENTRY_DSN:-} --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}
      - task: _sentry:upload

  build:web:prod:
    desc: Build the web application for production environment
    dir: apps/parable-bloom
    cmds:
      - flutter build web --release --source-maps --dart-define=APP_ENV=prod --dart-define=SENTRY_DSN=${SENTRY_DSN:-} --dart-define=OPENPANEL_CLIENT_ID=${OPENPANEL_CLIENT_ID:-} --dart-define=OPENPANEL_API_URL=${OPENPANEL_API_URL:-}
      - task: _sentry:upload

  # Uploads debug symbols / web source maps to Sentry after a release build.
  # No-op (with a log line) when SENTRY_AUTH_TOKEN is unset, so local builds
  # and Dependabot runs never fail on missing credentials.
  _sentry:upload:
    internal: true
    dir: apps/parable-bloom
    cmds:
      - |
        if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
          dart run sentry_dart_plugin
        else
          echo "SENTRY_AUTH_TOKEN unset — skipping Sentry symbol upload"
        fi

  # -----------------------------------------------------------------------------
  # Asset Management
  # -----------------------------------------------------------------------------

  generate_icons:
    desc: Generate app icons and favicon for all platforms using flutter_launcher_icons
    dir: apps/parable-bloom
    cmds:
      - dart run flutter_launcher_icons

  update_icons:
    desc: Update app icons using flutter_launcher_icons
    dir: apps/parable-bloom
    cmds:
      - flutter pub run flutter_launcher_icons:main

  # -----------------------------------------------------------------------------
  # Cleanup
  # -----------------------------------------------------------------------------

  clean:
    desc: Clean the Flutter build cache
    dir: apps/parable-bloom
    cmds:
      - flutter clean
